name: inference-bench
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Official CUDA 13.2 wheels for the project's PyTorch GPU runner.
      # PyTorch 2.12.1 / TorchVision 0.27.1 is the validated pair.
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.12.1
      - torchvision==0.27.1
      - numpy==2.5.2
      - onnx==1.22.0
      - onnxruntime-gpu==1.29.0
      # PyTorch's supported torch.export-based ONNX exporter requires this
      # package in addition to ONNX itself.
      - onnxscript==0.7.1
      # Python CPU runtime for the next engine in the initial matrix.
      - openvino==2026.3.0
      - matplotlib==3.11.1
      - psutil==7.2.2
      # YOLO11n detection export and raw pre-NMS PyTorch benchmark runner.
      - ultralytics==8.4.127
